services:
  mysql:
    image: mysql:8.0
    container_name: qwer-agent-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_DATABASE:-oa_demo}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: qwer-agent-app
    ports:
      - "${PORT:-8000}:8000"
    environment:
      DEMO_MODE: "0"
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-root}
      DB_DATABASE: ${DB_DATABASE:-oa_demo}
    volumes:
      - ./upload_cache:/app/upload_cache
      - ./data:/app/data
      - ./knowledge_base:/app/knowledge_base
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
